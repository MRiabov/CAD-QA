version: 1
runs:
  - name: smoke_dataset
    kind: data_prep
    command:
      - cadqa
      - smoke
      - --output-dir
      - runs/smoke_dataset/dataset
    output_dir: runs/smoke_dataset
    artifacts:
      - logs/stdout.log
      - dataset/metadata.json
      - dataset/split_manifest.json

  - name: validate_smoke_dataset
    kind: dataset_report
    depends_on: [smoke_dataset]
    command:
      - python
      - -m
      - scripts.dataset.dataset_stats
      - runs/smoke_dataset/dataset
      - --output
      - runs/validate_smoke_dataset/dataset_stats.json
    output_dir: runs/validate_smoke_dataset
    artifacts:
      - logs/stdout.log
      - dataset_stats.json

  - name: heuristic_baselines
    kind: baseline
    depends_on: [validate_smoke_dataset]
    command:
      - python
      - -m
      - scripts.evaluation.evaluate_baseline
      - runs/smoke_dataset/dataset/jsonl/train.jsonl
      - --output-dir
      - runs/heuristic_baselines
    output_dir: runs/heuristic_baselines
    artifacts:
      - logs/stdout.log
      - baseline_metrics.json

  - name: prepare_answer_sft_canary
    kind: data_prep
    depends_on: [heuristic_baselines]
    command:
      - python
      - -m
      - scripts.training.prepare_answer_sft_dataset
      - --dataset-dir
      - runs/smoke_dataset/dataset
      - --output-dir
      - runs/prepare_answer_sft_canary/sft
      - --max-train-rows
      - "512"
      - --max-eval-rows
      - "128"
    output_dir: runs/prepare_answer_sft_canary
    artifacts:
      - logs/stdout.log
      - sft/sft_dataset_report.json
      - sft/train.jsonl
      - sft/validation.jsonl

  - name: compare_heuristic_experiments
    kind: report
    depends_on: [heuristic_baselines]
    command:
      - python
      - -m
      - scripts.experiments.compare_experiment_runs
      - runs/heuristic_baselines
      - --output-dir
      - runs/compare_heuristic_experiments
    output_dir: runs/compare_heuristic_experiments
    artifacts:
      - logs/stdout.log
      - experiment_comparison.json
      - headline_comparison.csv
      - task_family_comparison.csv
      - split_comparison.csv

  - name: text_sft_format_smoke
    kind: local_smoke
    depends_on: [prepare_answer_sft_canary]
    command:
      - python
      - -m
      - scripts.training.text_sft_smoke
      - --sft-dir
      - runs/prepare_answer_sft_canary/sft
      - --output
      - runs/text_sft_format_smoke/text_sft_smoke_report.json
    output_dir: runs/text_sft_format_smoke
    artifacts:
      - logs/stdout.log
      - text_sft_smoke_report.json

  - name: check_canary_stop_gates
    kind: stop_gate
    depends_on: [compare_heuristic_experiments, text_sft_format_smoke]
    command:
      - python
      - -m
      - scripts.experiments.check_stop_gates
      - --dataset-stats
      - runs/validate_smoke_dataset/dataset_stats.json
      - --sft-smoke-report
      - runs/text_sft_format_smoke/text_sft_smoke_report.json
      - --experiment-comparison
      - runs/compare_heuristic_experiments/experiment_comparison.json
      - --output
      - runs/check_canary_stop_gates/stop_gate_report.json
      - --min-rows
      - "1"
    output_dir: runs/check_canary_stop_gates
    artifacts:
      - logs/stdout.log
      - stop_gate_report.json

  - name: answer_sft_canary
    kind: sft
    canary: true
    depends_on: [check_canary_stop_gates]
    model: unsloth/Qwen3.5-4B
    command:
      - python
      - -m
      - scripts.training.text_sft_train_unsloth
      - --dataset-dir
      - runs/smoke_dataset/dataset
      - --sft-dir
      - runs/prepare_answer_sft_canary/sft
      - --output-dir
      - runs/answer_sft_canary
      - --model
      - unsloth/Qwen3.5-4B
      - --max-train-rows
      - "512"
      - --max-eval-rows
      - "128"
      - --max-steps
      - "20"
      - --pack-tokenized
      - --no-assistant-only-loss
    output_dir: runs/answer_sft_canary
    artifacts:
      - logs/stdout.log
      - train_result.json

  - name: answer_sft_canary_dry_run
    kind: sft_dry_run
    depends_on: [check_canary_stop_gates]
    command:
      - python
      - -m
      - scripts.training.text_sft_train_unsloth
      - --dataset-dir
      - runs/smoke_dataset/dataset
      - --sft-dir
      - runs/prepare_answer_sft_canary/sft
      - --output-dir
      - runs/answer_sft_canary_dry_run
      - --model
      - unsloth/Qwen3.5-4B
      - --max-steps
      - "20"
      - --pack-tokenized
      - --no-assistant-only-loss
      - --dry-run
    output_dir: runs/answer_sft_canary_dry_run
    artifacts:
      - logs/stdout.log
      - train_result.json
