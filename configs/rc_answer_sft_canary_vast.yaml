version: 1
runs:
  - name: validate_rc_dataset
    kind: dataset_report
    command:
      - uv
      - run
      - python
      - -m
      - scripts.dataset.dataset_stats
      - data/cadqa_cadevolve_rc_10
      - --output
      - runs/validate_rc_dataset/dataset_stats.json
    output_dir: runs/validate_rc_dataset
    artifacts:
      - logs/stdout.log
      - dataset_stats.json

  - name: rc_heuristic_baselines
    kind: baseline
    depends_on: [validate_rc_dataset]
    command:
      - uv
      - run
      - python
      - -m
      - scripts.evaluation.evaluate_baseline
      - data/cadqa_cadevolve_rc_10/jsonl/train.jsonl
      - --output-dir
      - runs/rc_heuristic_baselines
    output_dir: runs/rc_heuristic_baselines
    artifacts:
      - logs/stdout.log
      - baseline_metrics.json

  - name: prepare_answer_sft_rc_canary
    kind: data_prep
    depends_on: [rc_heuristic_baselines]
    command:
      - uv
      - run
      - python
      - -m
      - scripts.training.prepare_answer_sft_dataset
      - --dataset-dir
      - data/cadqa_cadevolve_rc_10
      - --output-dir
      - runs/prepare_answer_sft_rc_canary/sft
      - --max-train-rows
      - "958"
      - --max-eval-rows
      - "128"
    output_dir: runs/prepare_answer_sft_rc_canary
    artifacts:
      - logs/stdout.log
      - sft/sft_dataset_report.json
      - sft/train.jsonl
      - sft/validation.jsonl

  - name: compare_rc_heuristic_experiments
    kind: report
    depends_on: [rc_heuristic_baselines]
    command:
      - uv
      - run
      - python
      - -m
      - scripts.experiments.compare_experiment_runs
      - runs/rc_heuristic_baselines
      - --output-dir
      - runs/compare_rc_heuristic_experiments
    output_dir: runs/compare_rc_heuristic_experiments
    artifacts:
      - logs/stdout.log
      - experiment_comparison.json
      - headline_comparison.csv
      - task_family_comparison.csv
      - split_comparison.csv

  - name: text_sft_rc_format_smoke
    kind: local_smoke
    depends_on: [prepare_answer_sft_rc_canary]
    command:
      - uv
      - run
      - python
      - -m
      - scripts.training.text_sft_smoke
      - --sft-dir
      - runs/prepare_answer_sft_rc_canary/sft
      - --output
      - runs/text_sft_rc_format_smoke/text_sft_smoke_report.json
    output_dir: runs/text_sft_rc_format_smoke
    artifacts:
      - logs/stdout.log
      - text_sft_smoke_report.json

  - name: check_rc_canary_stop_gates
    kind: stop_gate
    depends_on: [compare_rc_heuristic_experiments, text_sft_rc_format_smoke]
    command:
      - uv
      - run
      - python
      - -m
      - scripts.experiments.check_stop_gates
      - --dataset-stats
      - runs/validate_rc_dataset/dataset_stats.json
      - --sft-smoke-report
      - runs/text_sft_rc_format_smoke/text_sft_smoke_report.json
      - --experiment-comparison
      - runs/compare_rc_heuristic_experiments/experiment_comparison.json
      - --output
      - runs/check_rc_canary_stop_gates/stop_gate_report.json
      - --min-rows
      - "900"
    output_dir: runs/check_rc_canary_stop_gates
    artifacts:
      - logs/stdout.log
      - stop_gate_report.json

  - name: answer_sft_rc_canary
    kind: sft
    canary: true
    depends_on: [check_rc_canary_stop_gates]
    model: unsloth/Qwen3.5-4B
    command:
      - uv
      - run
      - --extra
      - training
      - python
      - -m
      - scripts.training.text_sft_train_unsloth
      - --dataset-dir
      - data/cadqa_cadevolve_rc_10
      - --sft-dir
      - runs/prepare_answer_sft_rc_canary/sft
      - --output-dir
      - runs/answer_sft_rc_canary
      - --model
      - unsloth/Qwen3.5-4B
      - --max-train-rows
      - "958"
      - --max-eval-rows
      - "128"
      - --max-steps
      - "20"
      - --pack-tokenized
      - --no-assistant-only-loss
    output_dir: runs/answer_sft_rc_canary
    artifacts:
      - logs/stdout.log
      - train_result.json
