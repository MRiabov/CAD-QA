schema_version: 2
project: CAD-QA
canonical_release_tier: benchmark-release
current_snapshot:
  date: "2026-05-24"
  codebase_state: >
    The repository has been reset around one graph-first CAD-QA architecture:
    source records, optional trace/snapshot evidence, typed ontology graphs,
    deterministic query programs, rule-rendered prompts, dataset rows, and
    verifier-backed validation. Core mechanisms exist, but release-grade
    question-family coverage, template diversity, split quality, and
    fine-tuning readiness remain incomplete. Main benchmark rows must require
    geometry-derived evidence rather than syntax-only source lookup. The
    critical path is kernel/geometry-backed task coverage for the rows models
    actually train on: volumes, bboxes, centroids, topology deltas,
    selector-result geometry, material/void deltas, path distances, and stable
    spatial relations. The next required slice is value-bearing measurement
    prompts and multi-hop equal-value distractor tasks: public clues should
    expose stable rounded/tolerance-bucketed CAD values when useful, then use
    additional geometry to disambiguate among equal or near-equal candidates.
    Task families must be maximally parameterized: axes, view words, min/max
    direction, exact values, comparison relations, target/reference entity
    types, and subtype choices are sampled row parameters whenever the verifier
    can support them, not permanent family semantics. Sparse direct extrema
    should be generated through a graph-hop query-synthesis layer: intended
    family specs, reusable geometry-derived narrowing predicates, bounded
    clause-chain search, sampled final selectors, and release gates for both
    generated-family balance and zero-row intended families. Benchmark-release
    readiness is the canonical public benchmark and real fine-tuning bar, not
    an optional polish pass: the target tier requires at least 10,000 release
    rows, at least 10,000 default SFT rows, strong geometry-hop and
    geometry-critical dominance, zero syntax-only default SFT rows,
    value-bearing and cross-feature coverage bands, parameter-balance limits,
    manual preview/test evidence, and non-collapsed train/validation/test
    splits. This benchmark-release level is a blocking functional contract:
    code, specs, this epic plan, release reports, default SFT reports, preview
    evidence, family-test evidence, and split audits must all agree before an
    artifact can be called benchmark-ready or fine-tuning-ready. Smoke and
    release-candidate tiers are development gates only.
    Earlier separate task-family and graph-query framing is obsolete.
status_values:
  - planned
  - work-in-progress
  - implemented
source_documents:
  - README.md
  - specs/benchmark-family.md
  - specs/benchmark-task-spec.md
  - specs/schema.md
  - specs/label_rules.md
  - specs/generation_policy.md
  - specs/dataset-spec.md
  - specs/extracting-cadevolve-features.md
  - specs/multi-hop-qa-task-spec.md
  - docs/multi-hop-qa-architecture.md
  - specs/paper-spec.md
release_tiers:
  smoke:
    purpose: Local plumbing checks, fixture review, and tiny end-to-end runs.
    supports_public_benchmark_claims: false
    supports_real_fine_tuning_claims: false
  release-candidate:
    purpose: Development-scale artifacts that exercise release machinery while generation coverage is still changing.
    supports_public_benchmark_claims: false
    supports_real_fine_tuning_claims: false
  benchmark-release:
    purpose: Canonical public benchmark and default SFT dataset release bar.
    supports_public_benchmark_claims: true
    supports_real_fine_tuning_claims: true
    claim_policy: >
      Dataset cards, paper tables, SFT manifests, and experiment summaries may
      call an artifact benchmark-ready or fine-tuning-ready only when this
      profile passes. Smoke and release-candidate artifacts are implementation
      checkpoints, not weaker benchmark-release levels.
    verdict_requirements:
      release_report_valid_for_release: true
      blocking_release_gates: 0
      default_sft_report_passes_same_tier: true
    numeric_gates:
      min_release_rows: 10000
      min_default_sft_rows: 10000
      max_default_sft_syntax_only_share: 0.0
      min_prompt_family_count: 10
      min_prompt_family_share: 0.01
      max_prompt_family_share: 0.10
      min_geometry_critical_training_share: 0.99
      max_syntax_only_calibration_share: 0.02
      min_geometry_hop_positive_share: 0.95
      min_logical_hop_ge_3_share: 0.90
      min_value_bearing_measurement_share: 0.15
      max_value_bearing_measurement_share: 0.30
      min_cross_feature_value_bearing_share: 0.05
      max_cross_feature_value_bearing_share: 0.15
      min_pre_final_candidate_count: 2
      min_median_pre_final_candidate_count: 4.0
      min_prompt_template_count: 20
      max_prompt_template_share: 0.05
      min_unique_answer_count: 1000
      min_answer_entropy_bits: 8.0
      max_parameter_value_share: 0.35
      min_axis_direction_parameter_share: 0.20
      min_split_groups_per_split: 3
      min_preview_samples_per_family: 20
    enforced_gates:
      intended_family_coverage: true
      parameter_balance: true
      preview_evidence: true
      family_test_evidence: true
    release_blockers:
      - missing intended release family rows
      - generated review-only, calibration, or unknown families in release rows
      - collapsed sampled parameters without geometry-limited justification
      - stale or insufficient manual preview evidence
      - missing positive-generation, failure/quarantine, or release-report test evidence
      - train-only split collapse or fewer than 3 protected groups per split
    synchronized_sources:
      - specs/dataset-spec.md
      - epics-and-stories.md
      - cad_qa/dataset/release_report.py
      - tests/test_graph_first_pipeline.py
