status_values:
  - planned
  - work-in-progress
  - implemented
status_definitions:
  planned: Specified in docs, but no concrete implementation or completed artifact is present in this repo snapshot.
  work-in-progress: Partially specified or partially built, with remaining acceptance criteria open.
  implemented: A concrete artifact exists for the story, but it is not necessarily final-pipeline verified.
stable_definition: true only after the feature has been confirmed to work in the final dataset pipeline.
ordering:
  source: specs
  rule: Epics follow the implementation order and research structure described in specs/useful-implementation-optimization.md, specs/extracting-cadevolve-features.md, specs/paper-spec.md, specs/research-experiment-spec.md, and the CADEditQA specs.
current_snapshot:
  date: "2026-04-29"
  codebase_state: CAD-QA now has a working Python package, CLI, source ingestion, AST operation graphs, isolated optional CadQuery tracing, scalar/topology snapshots, per-snapshot entity IDs, best-effort adjacent topology matching, conservative point/provenance records from adjacent volume deltas and adjacent topology matches, MVP public-row materialization including coordinate-frame and workplane-state tasks, advanced trace-backed diagnostic row materialization for spatial-distance, bbox-region, and validity/failure-mode QA, random and protected split assignment, near-boundary hard split routing, leakage validation, task-balanced subset export, JSONL export, optional Parquet export, trace caching, resumable sharded generation, grouped numeric counterfactual source generation, conservative CADEditQA parameter-edit, counterfactual-parameter, feature-to-edit, selector-repair, workplane-repair, and bounded multi-step edit-plan row materialization, optional multi-view SVG audit render bundles and render-backed request export, dataset cards, baselines including primitive symbolic volume, AABB point membership, and advanced diagnostic naive baselines, trace-label oracle upper bound, zero-shot and few-shot prediction request export, closed-book prediction response grading, P1 counterfactual sensitivity, task-transfer, and CADEditQA evaluation reports, answer-only and trace-grounded SFT data preparation, bounded parser-backed rejection-sampling reward scoring, guarded answer-only Unsloth SFT entrypoint, SFT ablation and scaling subset preparation, experiment orchestration, experiment comparison reports, canary stop gates, artifact retention and upload staging packages, manual audit sampling, failure taxonomy reports, reproducibility audits, paper draft scaffolding, smoke fixtures, tests, and validated smoke/CADEvolve-probe artifacts. Multi-Hop CAD-QA has a current rule-based architecture/spec and mock relation-gap survey, but the non-feature ontology implementation is open. Exact OpenCascade builder-history provenance, richer B-rep/sketch/profile/material-region coverage, richer near-boundary sampling, verified counterfactual labels, and live GPU SFT execution remain open or partial.
  stable_features:
