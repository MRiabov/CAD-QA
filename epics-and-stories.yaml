  - id: epic-15
    title: Benchmark-release numeric readiness tier
    status: implemented
    priority: P0
    acceptance_criteria:
      - Benchmark-release artifacts contain at least 10,000 release rows and at
        least 10,000 default SFT rows.
      - Default SFT rows are at least 99% geometry-critical and 0% syntax-only
        calibration.
      - Benchmark rows are at least 95% geometry-hop-positive and at least 90%
        `logical_hop_count >= 3`.
      - Value-bearing measurement rows are 15%-30% and cross-feature
        value-bearing rows are 5%-15% of benchmark-release rows.
      - Benchmark-release artifacts have at least 10 generated release task
        families, and every generated release family contributes 1%-10% of
        rows.
      - Prompt templates include at least 20 templates and are capped at 5%,
        answer entropy is at least 8 bits, and there are at least 1,000 unique
        gold answers.
      - High-hop rows have at least 2 pre-final candidates and median pre-final
        candidate breadth of at least 4.
      - Parameterized families keep sampled values at or below 35% share and
        supported axis/direction values at or above 20%, unless geometry-limited.
      - Multi-split benchmark releases have train/validation/test splits, at
        least 3 protected groups per split, and no train-only collapse.
      - Benchmark-release artifacts report `valid_for_release=true`, no
        blocking release gates, and passing default SFT benchmark-release gates;
        otherwise they remain development artifacts.
    stories:
      - id: "15.1"
        title: Document benchmark-release numeric gate tier
        status: implemented
      - id: "15.2"
        title: Configurable release-tier verifier profiles for smoke, release-candidate, and benchmark-release
        status: implemented
      - id: "15.3"
        title: Benchmark-release gates for row counts, geometry-hop coverage, geometry-critical dominance, and syntax-only caps
        status: implemented
        acceptance_criteria:
          - Users cannot label small, low-hop, non-geometry-critical, or syntax-only
            training artifacts as benchmark-release ready.
          - Default SFT exports have an explicit 0% syntax-only cap separate from
            the benchmark artifact's syntax-only calibration cap.
        technical_definition_of_done:
          - The benchmark-release verifier profile blocks artifacts below 10,000
            release rows, below 10,000 default SFT rows, below 95%
            geometry-hop-positive rows, below 99% default-SFT geometry-critical
            rows, above 0% default-SFT syntax-only rows, or above 2% benchmark
            syntax-only rows unless calibration is separated.
          - Release and SFT reports expose the `default_sft_syntax_only_cap` stop
            gate so failures are visible independently from geometry-critical
            dominance.
      - id: "15.4"
        title: Benchmark-release gates for value-bearing, cross-feature, prompt-template, answer-diversity, and candidate-breadth targets
        status: implemented
      - id: "15.5"
        title: Benchmark-release gates for parameter balance, intended-family coverage, split quality, and preview/test evidence
        status: implemented
