  - id: epic-14
    title: Maximally parameterized query sampling
    status: work-in-progress
    priority: P0
    acceptance_criteria:
      - Every generated release task family contributes at least 1% and at most
        10% of the exported release/SFT rows, or release is blocked.
      - Intended release task families with zero generated rows are blocked by
        an intended-family manifest once that manifest exists; until then, manual
        review must call them out as unfinished coverage.
      - Parameterized families expose sampled dimensions in private metadata and
        reports, including axis, sign, min/max direction, comparison relation,
        value shape, target type, reference type, and rendered wording.
      - >
        Sparse direct extrema are rewritten as graph-hop narrowing programs:
        sampled geometry-derived relations define a nontrivial candidate subset,
        then a sampled selector resolves exactly one answer.
      - Query synthesis is implemented as explicit family specs, a reusable
        predicate catalog, bounded clause-chain search, sampled final selector
        metadata, and the existing resolver/verifier/rendering path.
      - A family that collapses onto one avoidable constant or choice is capped,
        blocked, or moved to review-only artifacts.
    stories:
      - id: "14.1"
        title: Document avoidably hard-coded task-family semantics as unacceptable for release rows
        status: implemented
      - id: "14.2"
        title: Refactor fixed-axis, fixed-extremum, fixed-comparison, and fixed-entity query families into parameterized families
        status: work-in-progress
      - id: "14.3"
        title: Randomize rendered view words, min/max wording, exact-value clues, and entity-type wording from sampled parameters
        status: work-in-progress
      - id: "14.4"
        title: Release and SFT gates for parameter balance across task families
        status: work-in-progress
        acceptance_criteria:
          - Users cannot release a nominally parameterized family that always
            picks one axis, direction, value shape, selector, relation, or
            reference type when that dimension is meant to vary.
          - Users do not get false failures for structural family constants,
            such as a face family always targeting faces, when the manifest
            declares them as single expected values.
        technical_definition_of_done:
          - Release/SFT reports compute sampled-parameter distributions from
            private query metadata and block collapsed manifest-configured
            dimensions.
          - Families with explicit `parameter_balance` sections use those
            sections as the enforcement authority; legacy/unconfigured release
            families keep default parameter-collapse checks.
          - Benchmark-scale tuning still needs enough generated rows for each
            configured dimension to satisfy the distribution thresholds.
      - id: "14.5"
        title: Intended-family manifest for release, calibration, and review-only task families
        status: work-in-progress
      - id: "14.6"
        title: Predicate catalog for reusable geometry-derived narrowing clauses
        status: work-in-progress
      - id: "14.7"
        title: Bounded graph-hop query synthesis layer over ontology graphs
        status: work-in-progress
        acceptance_criteria:
          - Users can generate release-oriented graph-hop query records without
            calibration or review-only families being mixed into the default
            output.
          - Users can keep more than one viable sampled variant per family when
            a graph supports multiple valid axes, ranks, directions, metrics, or
            wording variants.
        technical_definition_of_done:
          - "cadqa query synthesize resolves synthesized graph-hop queries, filters to manifest release families by default, and writes query/failure report artifacts."
          - Synthesis keeps deterministic stable sampling while allowing a
            configurable maximum number of viable variants per family and graph.
          - Benchmark-scale family balance, full beam search, and broader real
            CadEvolve family coverage remain work-in-progress.
      - id: "14.8"
        title: Sampled query metadata and prompt-template bindings for synthesized queries
        status: work-in-progress
      - id: "14.9"
        title: Graph-hop narrowing implementation for sparse selector, count, and extremum task families
        status: work-in-progress
      - id: "14.10"
        title: Release and SFT gates for zero-row intended families and narrowing-parameter coverage
        status: work-in-progress
  - id: epic-15
    title: Benchmark-release numeric readiness tier
    status: implemented
    priority: P0
    acceptance_criteria:
      - Benchmark-release artifacts contain at least 10,000 release rows and at
        least 10,000 default SFT rows.
      - Default SFT rows are at least 99% geometry-critical and 0% syntax-only
        calibration.
      - Benchmark rows are at least 95% geometry-hop-positive and at least 90%
        `logical_hop_count >= 3`.
      - Value-bearing measurement rows are 15%-30% and cross-feature
        value-bearing rows are 5%-15% of benchmark-release rows.
      - Benchmark-release artifacts have at least 10 generated release task
        families, and every generated release family contributes 1%-10% of
        rows.
      - Prompt templates include at least 20 templates and are capped at 5%,
        answer entropy is at least 8 bits, and there are at least 1,000 unique
        gold answers.
      - High-hop rows have at least 2 pre-final candidates and median pre-final
        candidate breadth of at least 4.
      - Parameterized families keep sampled values at or below 35% share and
        supported axis/direction values at or above 20%, unless geometry-limited.
      - Multi-split benchmark releases have train/validation/test splits, at
        least 3 protected groups per split, and no train-only collapse.
      - Benchmark-release artifacts report `valid_for_release=true`, no
        blocking release gates, and passing default SFT benchmark-release gates;
        otherwise they remain development artifacts.
    stories:
      - id: "15.1"
        title: Document benchmark-release numeric gate tier
        status: implemented
      - id: "15.2"
        title: Configurable release-tier verifier profiles for smoke, release-candidate, and benchmark-release
        status: implemented
      - id: "15.3"
        title: Benchmark-release gates for row counts, geometry-hop coverage, geometry-critical dominance, and syntax-only caps
        status: implemented
        acceptance_criteria:
          - Users cannot label small, low-hop, non-geometry-critical, or syntax-only
            training artifacts as benchmark-release ready.
          - Default SFT exports have an explicit 0% syntax-only cap separate from
            the benchmark artifact's syntax-only calibration cap.
        technical_definition_of_done:
          - The benchmark-release verifier profile blocks artifacts below 10,000
            release rows, below 10,000 default SFT rows, below 95%
            geometry-hop-positive rows, below 99% default-SFT geometry-critical
            rows, above 0% default-SFT syntax-only rows, or above 2% benchmark
            syntax-only rows unless calibration is separated.
          - Release and SFT reports expose the `default_sft_syntax_only_cap` stop
            gate so failures are visible independently from geometry-critical
            dominance.
      - id: "15.4"
        title: Benchmark-release gates for value-bearing, cross-feature, prompt-template, answer-diversity, and candidate-breadth targets
        status: implemented
      - id: "15.5"
        title: Benchmark-release gates for parameter balance, intended-family coverage, split quality, and preview/test evidence
        status: implemented
        acceptance_criteria:
          - Users cannot release nominally parameterized families whose sampled
            values collapse to one axis, direction, value, or entity subtype.
          - Users cannot release a benchmark artifact with missing intended
            release families, stale manual-preview evidence, or absent family
            test evidence.
          - Users get train/validation/test splits over true leakage groups
            without broad corpus provenance collapsing a CadEvolve subtree into
            one train-only group.
        technical_definition_of_done:
          - Benchmark-release gates block collapsed parameter dimensions,
            zero-row intended release families, infeasible intended family
            counts for the 1%-10% family-share band, insufficient preview
            samples, missing family-test evidence, and fewer than 3 protected
            split groups per split.
          - Split grouping protects explicit leakage labels such as
            `split_group`, `counterfactual_group`, `source_family`, `family_id`,
            and `template_id`, while `generator_id` and `generator` remain
            reported provenance fields that do not merge unrelated source
            families into one split group.
