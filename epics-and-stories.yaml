  - specs/benchmark-task-spec.md
  - specs/label_rules.md
  - specs/schema.md
  - specs/generation_policy.md
  - specs/paper-spec.md
  - specs/research-experiment-spec.md
  - specs/cadedit-task-spec.md
  - specs/cadedit-full-spec.md
  - specs/extracting-cadevolve-features.md
  - specs/using-cadevolve-dataset-export.md
  - specs/dataset-spec.md
  - specs/useful-implementation-optimization.md
  - specs/reviewer-readiness-checklist.md
status_values:
  - planned
  - work-in-progress
  - implemented
status_definitions:
  planned: Specified in docs, but no concrete implementation or completed artifact is present in this repo snapshot.
  work-in-progress: Partially specified or partially built, with remaining acceptance criteria open.
  implemented: A concrete artifact exists for the story, but it is not necessarily final-pipeline verified.
stable_definition: true only after the feature has been confirmed to work in the final dataset pipeline.
ordering:
  source: specs
  rule: Epics follow the implementation order and research structure described in specs/useful-implementation-optimization.md, specs/extracting-cadevolve-features.md, specs/paper-spec.md, specs/research-experiment-spec.md, and the CADEditQA specs.
current_snapshot:
  date: "2026-04-28"
  codebase_state: CAD-QA now has a working Python package, CLI, source ingestion, AST operation graphs, isolated optional CadQuery tracing, scalar/topology snapshots, per-snapshot entity IDs, best-effort adjacent topology matching, conservative point/provenance records, MVP public-row materialization, random and protected split assignment, near-boundary hard split routing, leakage validation, task-balanced subset export, JSONL export, optional Parquet export, trace caching, resumable sharded generation, grouped numeric counterfactual source generation, dataset cards, baselines, zero-shot and few-shot prediction request export, SFT data preparation, experiment orchestration, experiment comparison reports, canary stop gates, artifact retention packages, manual audit sampling, failure taxonomy reports, reproducibility audits, paper draft scaffolding, smoke fixtures, tests, and validated smoke/CADEvolve-probe artifacts. Exact OpenCascade builder-history provenance, richer near-boundary sampling, verified counterfactual labels, real GPU SFT, CADEditQA verifier tasks, and multimodal/rendering extensions remain open or partial.
  stable_features:
    - cadqa_research_framing
    - cadqa_mvp_task_family_spec
    - cadqa_label_rule_spec
    - cadqa_public_schema_spec
    - cadevolve_source_policy
    - adjacent_cadevolve_source_reuse_policy
    - cadevolve_feature_extraction_policy
    - cadqa_generation_policy
    - cadqa_answer_parse_policy
    - cadqa_experiment_plan
    - cadeditqa_task_direction
    - reviewer_readiness_checklist
    - cadqa_python_package_and_cli
    - cadqa_source_ingestion_and_operation_graphs
    - cadqa_isolated_trace_worker
    - cadqa_mvp_public_row_materialization
    - cadqa_jsonl_export_and_validation
    - cadqa_baseline_and_sft_data_artifacts
    - cadqa_optional_parquet_export
    - cadqa_trace_cache_and_resumable_shards
    - cadqa_snapshot_entity_ids_and_topology_matching
    - cadqa_task_balanced_subset_export
    - cadqa_protected_split_assignment
    - cadqa_grouped_numeric_counterfactual_sources
    - cadqa_prediction_request_export
    - cadqa_release_audit_reports
    - cadqa_experiment_comparison_reports
    - cadqa_paper_draft_scaffold
    - cadqa_canary_stop_gates
