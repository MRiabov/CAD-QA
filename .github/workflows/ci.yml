name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs. It owns the checks that read the tree rather than the changed
  # lines, and it decides which test suites the diff can reach. A red check here
  # stops the suites instead of letting them run alongside it.
  quality_and_plan:
    name: quality-and-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      go: ${{ steps.plan.outputs.go }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The plan diffs the base commit against HEAD, so the checkout needs
          # the history that contains both.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-suffix: quality
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
            .pre-commit-config.yaml
            .rumdl.toml
            .github/workflows/ci.yml
          cache-python: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/dont-say-go/go.mod

      - name: Markdown
        run: |
          uvx --python "$(cat .python-version)" \
            --from 'rumdl==0.3.5' rumdl check docs plans

      - name: Don't-say terms
        run: |
          uv run --isolated --no-project --with 'pydantic>=2.14' \
            python tools/ci_cd/check_dont_say.py \
            --ratchet tools/ci_cd/dont_say_baseline.txt \
            --names-ratchet tools/ci_cd/dont_say_names_baseline.txt

      - name: Don't-say Go extractor
        working-directory: tools/dont-say-go
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Don't-say checker tests
        env:
          PYTHONPATH: .
        run: |
          uv run --isolated --no-project --with 'pydantic>=2.14' --with pytest \
            python -m pytest -q tests/test_check_dont_say.py

      - name: Doc mirror
        run: |
          uv run --isolated --no-project --with 'pydantic>=2.14' \
            python tools/ci_cd/check_doc_mirror.py

      - name: Plan the suites
        id: plan
        env:
          # A pull request diffs its base; a push diffs the previous tip. A
          # first push has an all-zero tip, which the planner reads as an
          # unknown diff and answers with every suite.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          uv run --isolated --no-project --with 'pydantic>=2.14' \
            python tools/ci_plan.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output

  go:
    name: go
    needs: quality_and_plan
    if: needs.quality_and_plan.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: generator/go.mod
          cache-dependency-path: generator/go.sum

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-suffix: worker-bridge
          cache-dependency-glob: |
            uv.lock
            .python-version
          cache-python: true

      - name: Install the Python worker bridge environment
        working-directory: .
        run: uv sync --frozen --only-group worker-bridge

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  python:
    name: python
    needs: quality_and_plan
    if: needs.quality_and_plan.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-suffix: tests
          cache-dependency-glob: |
            uv.lock
            .python-version
          cache-python: true

      - name: Install
        run: uv sync --frozen --no-default-groups --group test

      - name: Test
        run: uv run --frozen --no-sync pytest -q
