        - aggregation_metric
        - aggregation_rank
        - final_selector
      expected_values:
        aggregation_rank: [2, 3, 4]
    notes: Synthesized family that selects a measured face by sampled rank instead of only min/max extrema.
  - id: parameterized_equal_face_metric_extreme
    status: release
    target_type: face
    minimum_hops: 4
    maximum_hops: 4
    parameter_balance:
      required_dimensions:
        - narrowing_predicate_sequence
        - equal_measurement_metric
        - measurement_value_bucket
