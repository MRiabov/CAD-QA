        - aggregation_metric
        - extremum_direction
        - prompt_wording_variant
        - rendered_clue_template_sequence
        - rendered_prompt_template_id
      enforced_dimensions:
        - narrowing_predicate_sequence
        - aggregation_metric
        - final_selector
    notes: Synthesized family that samples the measured face quantity and min/max selector instead of fixing a global axis.
  - id: parameterized_kernel_face_rank
    status: release
    target_type: face
    minimum_hops: 3
    maximum_hops: 3
