schema_version: 1
families:
  - id: first_operation
    status: calibration
    target_type: operation
    minimum_hops: 0
    maximum_hops: 0
    notes: Syntax-readable calibration row, not benchmark-release training data.
  - id: highest_workplane
    status: review_only
    target_type: workplane
    minimum_hops: 1
    maximum_hops: 1
    notes: Direct fixed-Z workplane extremum; should become parameterized.
  - id: profile_on_workplane
    status: review_only
    target_type: profile
    minimum_hops: 2
    maximum_hops: 2
    notes: Early bridge fixture; direct workplane-Z selector is not release-grade.
  - id: cad_browsecomp_profile
    status: review_only
    target_type: profile
    minimum_hops: 3
    maximum_hops: 3
    notes: Early profile fixture overfits to workplane Z.
  - id: selected_face
    status: review_only
    target_type: face
    minimum_hops: 2
    maximum_hops: 2
    notes: Selector identity fixture; useful for audits, not final benchmark rows.
  - id: highest_kernel_selected_face
    status: review_only
    target_type: face
    minimum_hops: 3
    maximum_hops: 3
    notes: Legacy fixed face extremum; benchmark-release replacement is parameterized_kernel_face_extreme.
  - id: nearest_kernel_selected_face_center_to_origin
    status: review_only
    target_type: face
    minimum_hops: 3
    maximum_hops: 3
    notes: Legacy fixed origin-distance fixture; benchmark-release rows should use sampled reference anchors.
  - id: largest_kernel_selected_face_area
    status: review_only
    target_type: face
    minimum_hops: 3
    maximum_hops: 3
    notes: Legacy fixed face-area extremum; benchmark-release replacement is parameterized_kernel_face_extreme.
  - id: highest_equal_area_kernel_selected_face
    status: review_only
    target_type: face
    minimum_hops: 3
    maximum_hops: 3
    notes: Legacy fixed equal-area selector; benchmark-release replacement is parameterized_equal_face_metric_extreme.
  - id: nearest_equal_center_z_kernel_selected_face
    status: review_only
    target_type: face
    minimum_hops: 3
    maximum_hops: 3
    notes: Legacy fixed center-Z/origin-distance selector; benchmark-release replacement is parameterized_equal_face_metric_extreme or parameterized_face_reference_feature_distance.
  - id: parameterized_kernel_face_extreme
    status: release
    target_type: face
    minimum_hops: 3
    maximum_hops: 4
    parameter_balance:
      required_dimensions:
        - narrowing_predicate_sequence
        - aggregation_metric
        - extremum_direction
        - prompt_wording_variant
        - rendered_clue_template_sequence
        - rendered_prompt_template_id
      enforced_dimensions:
        - narrowing_predicate_sequence
        - aggregation_metric
        - final_selector
    notes: Synthesized family that samples the measured face quantity and min/max selector instead of fixing a global axis.
  - id: parameterized_kernel_face_rank
    status: release
    target_type: face
    minimum_hops: 3
    maximum_hops: 4
    parameter_balance:
      required_dimensions:
        - narrowing_predicate_sequence
        - aggregation_metric
        - aggregation_rank
        - rank_direction
        - prompt_wording_variant
        - rendered_clue_template_sequence
        - rendered_prompt_template_id
      enforced_dimensions:
        - narrowing_predicate_sequence
        - aggregation_metric
        - aggregation_rank
        - final_selector
      expected_values:
        aggregation_rank: [2, 3, 4, 5, 6]
    notes: Synthesized family that selects a measured face by sampled rank instead of only min/max extrema, bounded to reviewed ranks 2-6.
  - id: parameterized_equal_face_metric_extreme
    status: release
    target_type: face
    minimum_hops: 4
    maximum_hops: 4
    parameter_balance:
      required_dimensions:
        - narrowing_predicate_sequence
        - equal_measurement_metric
        - measurement_value_bucket
        - aggregation_metric
        - extremum_direction
        - prompt_wording_variant
        - rendered_clue_template_sequence
        - rendered_prompt_template_id
      enforced_dimensions:
        - narrowing_predicate_sequence
        - equal_measurement_metric
        - measurement_value_bucket
        - aggregation_metric
        - final_selector
    notes: Synthesized value-bearing face family that narrows to a repeated measured value before selecting by another measured quantity.
  - id: parameterized_equal_face_metric_rank
