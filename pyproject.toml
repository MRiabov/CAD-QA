[project]
name = "cad-qa"
version = "0.1.0"
description = "Trace-derived CAD-QA dataset generation and evaluation tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.10",
    "polars>=2.1.0",
    "pyarrow>=25.0",
    "pydantic>=2.14",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The CAD kernel is an extra: only pipeline stage 02b imports it, and the
# default install (worker, CLI, tests) does not need it.
cadquery = ["cadquery>=2.8.0"]
data = [
    "pandas>=3.1",
    "polars>=2.1.0",
]
dev = [
    "hypothesis>=6.170",
    "pre-commit>=4.7",
    "pyrefly>=1.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
    "rumdl>=0.3.5",
    "types-PyYAML>=6.0.12.20261113",
]
experiment = [
    "hf>=1.33",
    "vastai>=1.11",
]
parquet = ["pyarrow>=25.0"]
# The upper bounds are unsloth's own caps: unsloth pins torch<2.15,
# transformers<=5.17, trl<=1.15, and datasets<5. Without them the resolver
# keeps the newest transformers/trl/datasets and backtracks unsloth by more
# than a year.
training = [
    "datasets>=4.7,<5",
    "torch>=2.14,<2.15",
    "transformers>=4.40,<=5.17",
    "trl>=0.8,<=1.15",
    "unsloth",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator/python/cadqa_dataset_generator"]

[tool.pytest.ini_options]
testpaths = ["tests", "generator/python/tests"]
pythonpath = ["generator/python", "."]

[tool.pyrefly]
preset = "strict"
python-version = "3.12"

[dependency-groups]
# The Python test suite's runtime. CI installs this group without the local
# development toolchain, so pytest does not drag in the experiment drivers.
test = ["pytest>=9.2"]
# The Go bridge test starts the Python worker as a child process. This group is
# the worker's import surface, not the full pipeline environment, so the Go CI
# job does not install CadQuery and OCP.
worker-bridge = ["orjson>=3.10", "pydantic>=2.14"]
dev = [
    { include-group = "test" },
    "hypothesis>=6.170",
    "hf>=1.33",
    "pre-commit>=4.7",
    "pyrefly>=1.4",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
    "rumdl>=0.3.5",
    "types-PyYAML>=6.0.12.20261113",
    "vastai>=1.11",
    "kaggle>=2.2.5",
]
