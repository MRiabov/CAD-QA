# Install the git hook once:  uv run pre-commit install
# Run over every file:        uv run pre-commit run --all-files
#
# The rumdl hook lints Markdown against .rumdl.toml and fails on violations;
# add `args: [--fix]` (or use the `rumdl-fmt` hook) to rewrite files in place.
#
# Pyrefly runs on the manual stage until the old Python tree is removed.
# Remove the `stages` line to make it a blocking pre-commit hook.
# TODO(go): add gofumpt, goimports, and golangci-lint; generator/ exists, so they
# can be wired. The hook set and its status are declared in
# docs/dataset/implementation/stacks.md#pre-commit.
#
# Vendored agent skills under .agents/ are third-party material, so every hook
# excludes them.
exclude: ^\.agents/
repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.5
    hooks:
      - id: rumdl
        args: [--config=.rumdl.toml]
        files: ^(docs/|plans/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.4.1
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        pass_filenames: false
        language: system
        stages: [manual]
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      # Both are whole-repository scans (~1s), so each runs only when a scanned
      # file changes.
      - id: file-length
        name: File length (warn 800, fail 1,200)
        entry: tools/ci_cd/file-length
        language: system
        pass_filenames: false
        verbose: true
        files: \.(go|md|py|ya?ml)$
      - id: dont-say
        name: Don't-say terms
        entry: tools/ci_cd/dont-say --ratchet tools/ci_cd/dont_say_baseline.txt
        language: system
        pass_filenames: false
        files: ^(docs|dataset|train_and_eval|tools|plans)/.*\.(md|py|tex)$
      - id: worker-contracts
        name: Worker contract schemas and Go structs
        entry: tools/ci_cd/check-worker-contracts
        language: system
        pass_filenames: false
        files: ^(contracts/|cadqa_dataset_generator/contracts\.py|generator/internal/shared/(generate\.go|s01d_normalize_programs_contract\.go)|tools/contracts/)
