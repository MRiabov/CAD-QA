version: cadqa_prompt_v2
checklist_template_id: checklist_constraints_v1

prompt_shells:
  checklist: |
    Given the CadQuery script below, answer the question by reasoning about the CAD construction.

    ```python
    {source_code}
    ```

    Identify the target that satisfies all of these constraints:
    {clue_lines}

    Return exactly one {answer_format}.

fallback_templates:
  no_clause_target: "The target is a `{target_type}` entity from the script."
  unknown_clause: "The target satisfies the hidden `{kind}` clause."

aggregation_templates:
  argmax:
    - "Among the remaining candidates, choose the one with the greatest {metric_label}."
    - "From the remaining candidates, choose the one with the largest {metric_label}."
    - "Within the narrowed set, select the candidate with the maximum {metric_label}."
  argmin:
    - "Among the remaining candidates, choose the one with the smallest {metric_label}."
    - "From the remaining candidates, choose the one with the least {metric_label}."
    - "Within the narrowed set, select the candidate with the minimum {metric_label}."
  rank_desc:
    - "Among the remaining candidates, choose the {rank_label} candidate when ordered from greatest to smallest {metric_label}."
    - "From the remaining candidates, choose the {rank_label} item after sorting by descending {metric_label}."
    - "Within the narrowed set, select the {rank_label} candidate in decreasing {metric_label} order."
  rank_asc:
    - "Among the remaining candidates, choose the {rank_label} candidate when ordered from smallest to greatest {metric_label}."
    - "From the remaining candidates, choose the {rank_label} item after sorting by ascending {metric_label}."
    - "Within the narrowed set, select the {rank_label} candidate in increasing {metric_label} order."
  argmin.distance_to_reference_feature_centroid: "Among the remaining candidates, choose the one whose midpoint is closest to the reference feature's solid centroid."
  argmax.distance_to_reference_feature_centroid: "Among the remaining candidates, choose the one whose midpoint is farthest from the reference feature's solid centroid."

tie_break_templates:
  argmax:
    - "If that leaves a tie, choose the tied candidate with the greatest {metric_label}."
    - "If candidates are still tied, use the largest {metric_label} as the tie-break."
    - "For any remaining tie, keep the candidate with the maximum {metric_label}."
  argmin:
    - "If that leaves a tie, choose the tied candidate with the smallest {metric_label}."
    - "If candidates are still tied, use the least {metric_label} as the tie-break."
    - "For any remaining tie, keep the candidate with the minimum {metric_label}."

metric_labels:
  area: "profile area"
  bbox_delta_max_span: "increase in overall part size"
  bbox_delta_min_z: "upward movement of the lowest point"
  bbox_delta_span_z: "height increase"
  bbox_max_z: "maximum Z height"
  centroid_delta_magnitude: "centroid shift"
  centroid_delta_z: "upward centroid movement"
  centroid_x: "centroid X coordinate"
  centroid_y: "centroid Y coordinate"
  centroid_z: "centroid height"
  coordinate_z: "Z coordinate"
  coordinate_x: "X coordinate"
  coordinate_y: "Y coordinate"
  distance_to_origin: "distance to the global origin"
  distance_to_reference_feature_centroid: "distance to the reference feature's solid centroid"
  edge_length: "edge length"
  face_area: "surface area"
  midpoint_x: "midpoint X coordinate"
  midpoint_y: "midpoint Y coordinate"
  midpoint_z: "midpoint Z coordinate"
  nearest_point_distance_to_origin: "nearest-point distance to the global origin"
  operation_index: "modeling-sequence position"
  origin_z: "workplane origin height"
  segment_length: "segment length"
  selected_count: "number of selected entities"
  signed_volume_delta: "volume change"
  topology_delta_edges: "increase in edge count"
  topology_delta_faces: "increase in face count"
  topology_edges: "edge count"
  topology_faces: "face count"
  volume: "volume"
  volume_delta_magnitude: "removed-volume amount"
  workplane_origin_z: "workplane origin height"

